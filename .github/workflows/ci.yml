name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  readme:
    name: "Word Weasel / README.md"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
      - id: read_readme
        run: |
          echo "::set-output name=content::$(cat README.md)"
      - uses: codingjoe/word-weasel@v1
        with:
          text: ${{ steps.read_readme.outputs.content }}
  node-test:
    name: Test
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npx playwright install
      - run: sudo safaridriver --enable
      - run: npm test
        env:
          SAFARI: "1"
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: css
          files: lcov.info
